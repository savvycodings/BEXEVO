# Local Postgres + pgvector for e2e runs (never production). Started by `pnpm db:e2e`.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: xevo-e2e-db
    environment:
      POSTGRES_USER: xevo
      POSTGRES_PASSWORD: xevo
      POSTGRES_DB: xevo_e2e
    ports:
      - "5444:5432"
    volumes:
      - xevo_e2e_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xevo -d xevo_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  xevo_e2e_db:
